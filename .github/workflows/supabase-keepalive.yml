# Бесплатный проект Supabase засыпает, если за неделю к базе мало запросов: нужно несколько в день.
# Двух пингов в неделю не хватило: судя по сбоям, в конце октября 2026 база уснула. Поэтому дёргаем её четыре раза в сутки.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 */6 * * *' # каждые 6 часов
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          # Публичный ключ (тот же, что на сайте): им можно добавлять заявки, читать одобренные отзывы и вызывать keepalive().
          SUPABASE_URL: https://yqamuqihlrccpbcgzqsc.supabase.co
          SUPABASE_KEY: sb_publishable_55O5Jzs9UtFttpZMWRrCWg_jHn_uj0i
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          # keepalive() таблиц не трогает, поэтому ещё читаем из настоящей таблицы.
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"
