# Бесплатный проект Supabase засыпает после 7 дней без запросов.
# Два раза в неделю дёргаем безобидную функцию keepalive(), чтобы база с заявками не уснула.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * 1,4' # понедельник и четверг, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          # Публичный ключ (тот же, что на сайте): им можно только добавлять заявки и вызывать keepalive().
          SUPABASE_URL: https://yqamuqihlrccpbcgzqsc.supabase.co
          SUPABASE_KEY: sb_publishable_55O5Jzs9UtFttpZMWRrCWg_jHn_uj0i
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
